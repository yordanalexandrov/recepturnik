# Стекът на Рецептурника на homesrv: само Caddy със статиката (ADR-0001), без база и без secrets.
# deploy.yml: `docker compose -p recepturnik up -d --build`. Проверка локално: infra/check-image.sh.
name: recepturnik

services:
  web:
    build:
      context: .
      target: web
    # Host мрежа: Caddy слуша на 127.0.0.1:18092 (cloudflared → http://localhost:18092) и стига api-то на family
    # на 127.0.0.1:$API_PORT, което е на host мрежата на стека family.
    network_mode: host
    environment:
      API_PORT: ${API_PORT:-18091}
    restart: unless-stopped
